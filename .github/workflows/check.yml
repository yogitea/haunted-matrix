name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .
      - run: python tests/test_gallery.py
      - run: python tests/test_transitions.py
      - run: python tests/test_ambience.py
      - run: python tests/test_runtime.py
      - run: python tests/test_release.py
